version: 2

updates:
  # npm: root manifest (build/dev tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  # npm: Paella player bundle in subdirectory
  - package-ecosystem: "npm"
    directory: "/js/opencast/src/Paella"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # The @asicupv/paella-* packages are released in lockstep, so bumping
      # them one by one produces broken intermediate states.
      paella:
        patterns:
          - "@asicupv/*"

  # No workflows exist yet; this keeps actions covered once CI is added.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
